<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quill by RavenDB</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 4rem auto; max-width: 40rem; padding: 0 1.5rem; line-height: 1.6; color: #1a1a1a; }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        .sub { color: #666; margin-top: 0; }
        code { background: #f2f2f2; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.9em; }
        @media (prefers-color-scheme: dark) {
            body { color: #e6e6e6; background: #1a1a1a; }
            .sub { color: #9a9a9a; }
            code { background: #2a2a2a; }
        }
    </style>
</head>
<body>
    <h1>Quill by RavenDB</h1>
    <p class="sub">The backend is running.</p>
    <p>
        This placeholder is served only in local development when the web UI has not
        been built into <code>wwwroot</code>. In the container image the built React
        app (<code>Raven.Quill.Web/dist</code>) replaces this page.
    </p>
    <p>
        The API is available under <code>/api</code>; <code>GET /healthz</code>
        reports readiness.
    </p>
</body>
</html>
