<div class="modal-dialog modal-lg storageCongestionDetails" id="js-storage-congestion-details" role="document">
    <div class="modal-content force-text-wrap-word" tabindex="-1">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <div data-bind="with: hint">
                <h3 class="modal-title" id="myModalLabel" data-bind="text: title, attr:{ class: 'modal-title ' + headerClass() }"></h3>
                <div class="notification-time" data-bind="text: displayDate().format('LLL')"></div>
            </div>
        </div>
        <div class="modal-body">
            <h3 data-bind="html: hint.message"></h3>
            <div class="modal-details" data-bind="foreach: summaryItems">
                <div class="details-item">
                    <div class="row">
                        <div class="col-sm-4 text-right" data-bind="text: name"></div>
                        <div class="col-sm-8 details-value" data-bind="text: value"></div>
                    </div>
                </div>
            </div>
            <!-- ko ifnot: slowWritesMeasured -->
            <div class="text-muted">
                <i class="icon-info"></i> <span>Slow writes are not measured: Storage.IO.Metrics.Enabled is off</span>
            </div>
            <!-- /ko -->
            <!-- ko if: slowWritesMeasured -->
            <!-- ko if: tableItems.length -->
            <h4>Slowest writes on this disk in the last hour</h4>
            <div class="margin-bottom" style="position: relative; height: 300px">
                <virtual-grid style="height: 300px" class="resizable flex-window" params="controller: gridController"></virtual-grid>
            </div>
            <!-- /ko -->
            <!-- ko ifnot: tableItems.length -->
            <div class="text-muted">
                <i class="icon-info"></i> <span>No slow writes on this disk in the last hour.</span>
            </div>
            <!-- /ko -->
            <!-- /ko -->
        </div>
        <div class="modal-footer" data-bind="compose: $root.footerPartialView">
        </div>
    </div>
</div>
<div class="tooltip json-preview js-storage-congestion-details-tooltip" style="opacity: 0">
</div>
