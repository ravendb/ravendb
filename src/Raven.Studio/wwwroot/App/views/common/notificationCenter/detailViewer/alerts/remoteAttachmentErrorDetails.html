<div class="modal-dialog modal-lg modal-grid remoteAttachmentErrorDetails" id="js-remote-attachment-error-details" role="document">
    <div class="modal-content force-text-wrap-word" tabindex="-1">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <div data-bind="with: alert">
                <h3 class="modal-title" id="myModalLabel" data-bind="text: title, attr:{ class: 'modal-title ' + headerClass() }"></h3>
                <div class="notification-time" data-bind="text: displayDate().format('LLL')"></div>
            </div>
        </div>
        <div class="modal-body">
            <h3 data-bind="html: alert.message"></h3>
            <div class="modal-grid-toolbar" data-bind="with: gridToolbar">
                <span class="text-muted" data-bind="text: summary"></span>
                <button type="button" class="btn btn-default btn-sm" data-bind="click: exportToCsv, enable: canExport" title="Download all rows as a CSV file">
                    <i class="icon-csv-export"></i><span>Export to CSV</span>
                </button>
            </div>
            <div class="modal-grid-container margin-bottom">
                <virtual-grid class="resizable flex-window" params="controller: gridController, fitToContent: true"></virtual-grid>
            </div>
            <div data-bind="with: currentDetails">
                <div class="flex-horizontal">
                    <h3>Details:</h3>
                    <div class="flex-separator"></div>
                    <div>
                        <button class="btn btn-default" data-bind="click: $root.copyToClipboard">
                            <i class="icon-copy"></i>
                            <span>Copy error to clipboard</span>
                        </button>
                    </div>
                </div>
                <div class="modal-details">
                    <div class="details-item">
                        <div class="row">
                            <div class="col-sm-3 text-right">
                                Identifier:
                            </div>
                            <div class="col-sm-9 details-value">
                                <span data-bind="text: Identifier"></span>
                            </div>
                        </div>
                    </div>
                    <div class="details-item">
                        <div class="row">
                            <div class="col-sm-3 text-right">
                                Hash:
                            </div>
                            <div class="col-sm-9 details-value">
                                <span data-bind="text: Hash"></span>
                            </div>
                        </div>
                    </div>
                    <div class="details-item">
                        <div class="row">
                            <div class="col-sm-3 text-right">
                                Document IDs:
                            </div>
                            <div class="col-sm-9 details-value">
                                <span data-bind="text: Ids ? Ids.join(', ') : ' - '"></span>
                            </div>
                        </div>
                    </div>
                    <div class="details-item">
                        <div class="row">
                            <div class="col-sm-3 text-right">
                                Date:
                            </div>
                            <div class="col-sm-9 details-value">
                                <span data-bind="text: Date"></span>
                            </div>
                        </div>
                    </div>
                    <div class="details-item">
                        <div class="row">
                            <div class="col-sm-3 text-right">
                                Error:
                            </div>
                            <div class="col-sm-9">
                                <pre style="max-height: 250px;" data-bind="text: Error"></pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer" data-bind="compose: $root.footerPartialView">
        </div>
    </div>
</div>
<div class="tooltip json-preview js-remote-attachment-error-details-tooltip" style="opacity: 0">
</div>
