<div class="modal-dialog modal-lg modal-grid virtualDeleteByQueryFailuresDetails" role="document">
    <div class="modal-content" tabindex="-1">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: $root.close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h3 class="modal-title text-danger" id="myModalLabel">Delete by query - failures</h3>
            <div class="notification-time" data-bind="text: virtualNotification.displayDate().format('LLL')"></div>
        </div>
        <div class="modal-body">
            <div class="modal-grid-toolbar" data-bind="with: gridToolbar">
                <span class="text-muted" data-bind="text: summary"></span>
                <button type="button" class="btn btn-default btn-sm" data-bind="click: exportToCsv, enable: canExport" title="Download all rows as a CSV file">
                    <i class="icon-csv-export"></i><span>Export to CSV</span>
                </button>
            </div>
            <div class="modal-grid-container margin-bottom">
                <virtual-grid class="resizable flex-window" params="controller: gridController, fitToContent: true"></virtual-grid>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: close">
                <i class="icon-cancel"></i><span>Close</span>
            </button>
        </div>
    </div>
</div>

<div class="tooltip json-preview js-virtual-delete-by-query-failures-details-tooltip" style="opacity: 0">
</div>
