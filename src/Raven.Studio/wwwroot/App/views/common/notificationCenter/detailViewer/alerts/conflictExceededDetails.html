<div class="modal-dialog modal-lg modal-grid conflictExceededDetails" id="js-conflict-exceeded-details" role="document">
    <div class="modal-content force-text-wrap-word" tabindex="-1">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <div data-bind="with: alert">
                <h3 class="modal-title" id="myModalLabel" data-bind="text: title, attr:{ class: 'modal-title ' + headerClass() }"></h3>
                <div class="notification-time" data-bind="text: displayDate().format('LLL')"></div>
            </div>
        </div>
        <div class="modal-body">
            <h3 data-bind="html: alert.message"></h3>
            <div class="modal-grid-toolbar" data-bind="with: gridToolbar">
                <span class="text-muted" data-bind="text: summary"></span>
                <button type="button" class="btn btn-default btn-sm" data-bind="click: exportToCsv, enable: canExport" title="Download all rows as a CSV file">
                    <i class="icon-csv-export"></i><span>Export to CSV</span>
                </button>
            </div>
            <div class="modal-grid-container">
                <virtual-grid class="resizable flex-window" params="controller: gridController, fitToContent: true"></virtual-grid>
            </div>
        </div>
        <div class="modal-footer" data-bind="compose: $root.footerPartialView">
        </div>
    </div>
</div>
<div class="tooltip json-preview js-conflict-exceeded-tooltip" style="opacity: 0">
</div>
