<div class="documents content-margin">
    <div class="flex-window stretch">
        <div class="flex-window-head">
            <div class="clearfix">
                <div class="btn-group">
                    <button type="button" class="btn btn-primary"
                            data-bind="click: newDocument, requiredAccess: 'DatabaseReadWrite'">
                        <i class="icon-new-document"></i>
                        <span data-bind="i18n: 'documents:newDocument'"></span>
                    </button>
                    <button type="button" class="btn btn-primary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                            data-bind="enable: inSpecificCollection, requiredAccess: 'DatabaseReadWrite'">
                        <span class="caret"></span>
                        <span class="sr-only" data-bind="i18n: 'documents:toggleDropdown'"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="#" data-bind="click: newDocumentInCollection.bind($root)"><i class="icon-new-document"></i> <span data-bind="i18n: 'documents:newDocumentInCollection'"></span></a></li>
                    </ul>
                </div>
                <div class="btn-group-label" data-bind="css: { active: selectedItemsCount }, i18nAttr: { 'data-label': 'documents:selectionLabel' }" role="group">
                    <button type="button" class="btn btn-danger"
                            data-bind="click: deleteSelected, css: { 'btn-spinner': spinners.delete() }, enable: deleteEnabled, requiredAccess: 'DatabaseReadWrite'">
                        <span class="icon-trash"></span> <span data-bind="i18n: 'common:delete'"></span>
                    </button>
                    <div class="btn-group has-disable-reason" data-bind="attr: { 'data-original-title': copyDisabledReason().reason }">
                        <button type="button" class="btn" data-bind="disable: copyDisabledReason().disabled || spinners.copy(), click: copySelectedDocs, css: { 'btn-spinner': spinners.copy() }">
                            <span class="icon-copy"></span> <span data-bind="i18n: 'common:copy'"></span>
                        </button>
                        <button type="button" class="btn dropdown-toggle" disabled="disabled" data-toggle="dropdown" data-bind="disable: copyDisabledReason().disabled">
                            <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a href="#" data-bind="click: copySelectedDocIds, i18n: 'documents:copyIds'"></a></li>
                        </ul>
                    </div>
                    <!-- TODO
                <div class="btn-group">
                    <button type="button" class="btn" disabled="disabled" data-toggle="button">
                        <span class="icon-export"></span> <span>Export</span>
                    </button>
                </div>-->
                </div>
            </div>
            <div class="clearfix">
                <div class="pull-right">
                    <button class="btn btn-default btn-sm" data-bind="click: $root.queryCollection, i18nAttr: { title: 'documents:queryTitle' }">
                        <i class="icon-query"></i>
                        <span data-bind="i18n: 'documents:query'"></span>
                    </button>
                    <div class="btn-group" data-bind="visible: canExportToFile">
                        <button class="btn btn-default btn-sm dropdown-toggle" type="button" data-toggle="dropdown"
                                aria-haspopup="true" aria-expanded="true" data-bind="i18nAttr: { title: 'documents:exportPanel.title' }">
                            <i class="icon-csv-export"></i><span data-bind="i18n: 'documents:exportPanel.button'"></span>
                            <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu padding padding-sm slidein-style" role="menu" data-bind="dropdownPanel: true">
                            <div class="flex-form padding padding-sm">
                                <div class="form-group flex-horizontal gap-3">
                                    <label class="mb-0 align-self-center" style="width: 60px;" data-bind="i18n: 'documents:exportPanel.format'"></label>
                                    <div class="btn-group flex-horizontal">
                                        <button type="button" class="btn btn-dark"
                                                data-bind="click: _.partial(exportAsFileSettings.format, 'csv'), css: { active: exportAsFileSettings.format() === 'csv' }">CSV</button>
                                        <button type="button" class="btn btn-dark"
                                                data-bind="click: _.partial(exportAsFileSettings.format, 'json'), css: { active: exportAsFileSettings.format() === 'json' }">JSON</button>
                                    </div>
                                </div>
                                <div class="form-group flex-horizontal gap-3">
                                    <label class="mb-0 align-self-center" style="width: 60px;" data-bind="i18n: 'documents:exportPanel.columns'"></label>
                                    <div class="btn-group flex-horizontal">
                                        <button type="button" class="btn btn-dark"
                                                data-bind="click: _.partial(exportAsFileSettings.allColumns, true), css: { active: exportAsFileSettings.allColumns() }, i18n: 'documents:exportPanel.allColumns'"></button>
                                        <button type="button" class="btn btn-dark"
                                                data-bind="click: _.partial(exportAsFileSettings.allColumns, false), css: { active: !exportAsFileSettings.allColumns() }, i18n: 'documents:exportPanel.visibleColumns'"></button>
                                    </div>
                                </div>
                                <div class="form-group margin-top-sm mb-0">
                                    <div class="btn-group">
                                        <button type="button" class="btn btn-primary close-panel" data-bind="click: exportAsFile">
                                            <i class="icon-download"></i>
                                            <span data-bind="i18n: 'common:export'"></span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                        </ul>
                    </div>
                    <div class="btn-group dropdown-right">
                        <button class="btn btn-default btn-sm dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true"
                                data-bind="css: { active: columnsSelector.customLayout }, i18nAttr: { title: { key: 'documents:displayTitle', options: { context: columnsSelector.customLayout() ? 'custom' : 'default' } } }">
                            <i class="icon-table"></i><span data-bind="i18n: 'documents:display'"></span>
                            <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu colselect-dropdown slidein-style" role="menu" data-bind="dropdownPanel: true">
                            <div data-bind="compose: { model: $root.columnsSelector }"></div>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex-window-scroll">
            <div class="scroll-stretch">
                <div class="panel">
                    <virtual-grid class="resizable documents-grid" params="controller: gridController, emptyTemplate: 'empty-collection-template'"></virtual-grid>
                </div>
            </div>
        </div>
        <div class="has-error" data-bind="visible: dataChanged()">
            <div class="help-block">
                <i class="icon-danger"></i><span><span data-bind="i18n: 'documents:dataChanged'"></span> <a href="#" data-bind="click: refresh, i18n: 'common:refresh'"></a></span>
            </div>
        </div>
    </div>
    <div class="hidden">
        <form method="post" download target="hidden-form" id="exportCsvForm">
            <input type="hidden" name="ExportOptions"/>
        </form>
    </div>
</div>

<script type="text/html" id="empty-collection-template">
    <div data-bind="i18n: { key: 'documents:emptyGrid', options: { context: $root.currentCollection().isAllDocuments ? 'allDocuments' : 'collection' } }">
    </div>
</script>
<div class="tooltip json-preview js-documents-preview" style="opacity: 0">
    <pre><code></code></pre>
</div>

<div data-bind="if: deleteDocumentsModalView()">
    <div data-bind="react: $root.deleteDocumentsModalView"></div>
</div>
