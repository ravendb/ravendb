<form class="flex-vertical absolute-fill flex-form content-margin" data-bind="submit: save">
    <div class="flex-header">
        <button type="submit" class="btn btn-primary" data-bind="enable: dirtyFlag().isDirty, requiredAccess: 'DatabaseAdmin'">
            <i class="icon-save"></i>
            <span data-bind="i18n: 'common:save'"></span>
        </button>
        <button class="btn btn-default" data-bind="click: cancelOperation, i18nAttr: { title: 'editCustomSorter:cancelTitle' }">
            <i class="icon-cancel"></i>
            <span data-bind="i18n: 'common:cancel'"></span>
        </button>
        <label for="importFilePicker" class="btn btn-default pull-right" data-bind="i18nAttr: { title: 'editCustomSorter:loadFromFileTitle' }, requiredAccess: 'DatabaseAdmin'">
            <i class="icon-import"></i><span data-bind="i18n: 'common:loadFromFile'"></span>
        </label>
        <div class="input-group file-input">
            <input type="file" id="importFilePicker" data-bind="event: { change: _.partial(fileSelected, $element) }" tabindex="-1" accept=".cs">
        </div>
    </div>
    <div class="panel padding flex-grow flex-vertical" data-bind="with: editedSorter">
        <h3 data-bind="i18n: { key: 'editCustomSorter:heading', options: { context: $parent.isAddingNewSorter() ? 'new' : 'edit' } }"></h3>
        <div class="form-group margin-top" data-bind="validationElement: name">
            <label class="control-label" for="sorterName" data-bind="i18n: 'editCustomSorter:nameLabel'"></label>
            <div class="flex-grow">
                <input type="text" class="form-control" id="sorterName"
                       data-bind="textInput: name, enable: $root.isAddingNewSorter, i18nAttr: { placeholder: 'editCustomSorter:namePlaceholder' }" autocomplete="off" >
            </div>
        </div>
        <label data-bind="i18n: 'editCustomSorter:codeLabel'"></label>
        <pre class="form-control margin-top flex-grow"
             data-bind="aceEditor: { code: code, lang:'ace/mode/csharp', readOnly: !$root.isAdminAccessOrAbove() }, 
                        validationOptions: { errorsAsTitle: false }, validationElement: code" style="height: 300px;">
        </pre>
        <div data-bind="validationOptions: { errorsAsTitle: false }, validationElement: code">
            <div class="help-block" data-bind="validationMessage: code"></div>
        </div>
    </div>
</form>
