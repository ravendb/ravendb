# AI Appliance (Quill) :443 SNI front (Phase 1). One published port; routed by SNI:
#   db.*  / a.*  -> RavenDB, TLS pass-through (RavenDB terminates; admin-cert / mTLS preserved).
#   everything else (dashboard.* / api.* / public.*) -> terminate with the wildcard cert -> web app :5000.
# Subdomain matching is by prefix (regex), so this is independent of the instance's base domain.

worker_processes auto;
error_log /dev/stderr info;
pid /run/nginx.pid;

# Debian ships stream + ssl_preread (+ stream realip) as dynamic modules; load them (this config
# replaces the distro default that would otherwise pull them in via modules-enabled).
include /etc/nginx/modules-enabled/*.conf;

events { worker_connections 1024; }

# ---- Layer 4: SNI router on the public :443 (no decryption here) ----
stream {
    map $ssl_preread_server_name $upstream {
        ~^db\.      127.0.0.1:8443;   # RavenDB (db.<base>) — raw passthrough
        ~^a\.       127.0.0.1:8443;   # RavenDB's advertised PublicServerUrl host (a.<base>)
        ~^public\.  127.0.0.1:8445;   # public embed surface — terminate, /embed/* only
        default     127.0.0.1:8444;   # dashboard./api. — terminate, full app
    }

    server {
        listen 443;
        ssl_preread on;            # read SNI without terminating TLS
        proxy_pass $upstream;
        # No proxy_protocol: db.*/a.* are raw passthrough to RavenDB, which doesn't speak the PROXY
        # protocol (a PROXY header would corrupt its TLS handshake). One SNI listener can't send it
        # selectively, so the web terminator below sees the loopback IP -> the app rate-limits
        # per-appliance rather than per-client. Acceptable for a single-operator appliance.
        proxy_timeout 1h;          # long-lived WebSocket / streaming chat
    }
}

# ---- Layer 7: TLS terminate for the web subdomains, forward to the web app ----
http {
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    server {
        listen 127.0.0.1:8444 ssl;
        server_name _;

        ssl_certificate     /var/lib/ai-appliance/proxy/fullchain.pem;
        ssl_certificate_key /var/lib/ai-appliance/proxy/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            # WebSocket upgrade for cdc/progress + streaming chat; no buffering for NDJSON/SSE.
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_buffering off;
        }
    }

    # public.* — public embed consume surface ONLY. No SPA, no /api, no /assets, no /login.
    # The embed page (EmbedEndpoints) is self-contained HTML whose only call is
    # /embed/{token}/chat, so /embed/ is the entire surface; everything else is 404.
    server {
        listen 127.0.0.1:8445 ssl;
        server_name _;

        ssl_certificate     /var/lib/ai-appliance/proxy/fullchain.pem;
        ssl_certificate_key /var/lib/ai-appliance/proxy/privkey.pem;

        location /embed/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_read_timeout 1h;
            proxy_buffering off;   # stream the embed chat NDJSON
        }

        location / { return 404; }
    }
}
