name: Studio conventions

on:
  push:
    branches:
        - feature/*
        - release/**
        - 'v[4-9]+.[0-9]+'

  pull_request:
    branches:
        - feature/*
        - release/**
        - 'v[4-9]+.[0-9]+'
jobs:
  conventions:
    name: Studio Conventions
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Install dependencies
      run: dotnet restore

    - name: Build dotnet
      run: dotnet build
      working-directory: ./tools/TypingsGenerator

    - name: Install npm dependencies
      run: npm ci
      working-directory: ./src/Raven.Studio
  
    - name: Restore Studio
      run: npm run restore
      working-directory: ./src/Raven.Studio

    - name: Lint Studio
      if: always()
      run: npm run lint
      working-directory: ./src/Raven.Studio

    - name: Prettier Studio
      if: always()
      run: |
        branch=${GITHUB_BASE_REF:-$GITHUB_REF_NAME}

        [[ ${branch:1:1} -lt 6 ]] && echo "skipping prettier for ravendb versions below 6.0" && exit 0

        npm run prettier
      working-directory: ./src/Raven.Studio

  quill-web-conventions:
    name: Quill Dashboard Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./src/Raven.Quill.Web
    steps:
    # paths-filter reads the REST API on pull_request but shells out to git on push,
    # so the checkout has to come first and stay ungated.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        filters: |
          quillWeb:
            - 'src/Raven.Quill.Web/**'

    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      if: steps.changes.outputs.quillWeb == 'true'
      with:
        package_json_file: src/Raven.Quill.Web/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.changes.outputs.quillWeb == 'true'
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: src/Raven.Quill.Web/pnpm-lock.yaml

    - name: Install dependencies
      id: install
      if: steps.changes.outputs.quillWeb == 'true'
      run: pnpm install --frozen-lockfile

    # Each check reports independently, but none is meaningful without dependencies.
    - name: Typecheck
      if: steps.changes.outputs.quillWeb == 'true'
      run: pnpm typecheck

    - name: Lint
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: pnpm lint

    - name: Prettier
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: pnpm format:check

    - name: Unit tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: pnpm test:unit
