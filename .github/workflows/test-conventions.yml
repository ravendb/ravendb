name: tests/conventions

on:
  push:
    branches:
        - feature/*
        - release/**
        - 'v[4-9]+.[0-9]+'

  pull_request:
    branches:
        - feature/*
        - release/**
        - 'v[4-9]+.[0-9]+'

jobs:
  release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Install dependencies
      run: dotnet restore SlowTests.csproj
      working-directory: ./test/SlowTests

    - name: Test - Release
      run: dotnet test SlowTests.csproj --configuration Release --no-restore --filter Category=Codebase
      env: # Or as an environment variable
        RAVEN_LICENSE: ${{ secrets.RAVEN_LICENSE }}
        RAVEN_MAX_RUNNING_TESTS: 1
      working-directory: ./test/SlowTests

