name: quill/web-checks

permissions:
  contents: read

on:
  # Same long-lived branches as studioConventions.yml: limiting push to them keeps every
  # PR commit from running the checks twice (PR branches are covered by pull_request).
  push:
    branches:
      - feature/*
      - release/**
      - 'v[4-9]+.[0-9]+'
    paths:
      - 'src/Raven.Quill.Web/**'
      - '.github/workflows/quill-web-checks.yml'
  pull_request:
    branches:
      - feature/*
      - release/**
      - 'v[4-9]+.[0-9]+'
    paths:
      - 'src/Raven.Quill.Web/**'
      - '.github/workflows/quill-web-checks.yml'

defaults:
  run:
    working-directory: ./src/Raven.Quill.Web

jobs:
  conventions:
    name: Typecheck, lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/Raven.Quill.Web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/Raven.Quill.Web/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The three checks report independently (a lint failure should not hide a format one),
      # but none of them can produce a meaningful result without installed dependencies.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:unit

  storybook-tests:
    name: Storybook smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/Raven.Quill.Web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/Raven.Quill.Web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `playwright install` needed: vitest.config.ts targets the system
      # Chrome (channel "chrome"), which GitHub runners preinstall.
      - name: Run Storybook tests
        run: pnpm test:storybook
