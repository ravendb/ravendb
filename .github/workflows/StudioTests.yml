name: tests/studio

on:
  push:
    branches:
        - feature/*
        - release/**
        - 'v[4-9]+.[0-9]+'

  pull_request:
    branches:
        - feature/*
        - release/**
        - 'v[4-9]+.[0-9]+'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        
    - name: Setup nodejs
      uses: actions/setup-node@v4
      with:
        node-version-file: 'src/Raven.Studio/.nvmrc'

    - name: Install dependencies
      run: dotnet restore

    - name: Build dotnet
      run: dotnet build
      working-directory: ./tools/TypingsGenerator

    - name: Install npm dependencies
      run: npm ci
      working-directory: ./src/Raven.Studio
  
    - name: Restore Studio
      run: npm run restore
      working-directory: ./src/Raven.Studio

    - name: Compile Studio
      run: npm run compile
      working-directory: ./src/Raven.Studio

    - name: Test Studio (jest)
      run: npm run test
      working-directory: ./src/Raven.Studio

    - name: Build Storybook
      run: npm run build-storybook --quiet
      working-directory: ./src/Raven.Studio

    - name: Test Studio (storybook)
      run: |
        npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
          "npx http-server storybook-static --port 6006 --silent" \
          "npx wait-on tcp:127.0.0.1:6006 && npm run test-storybook"
      working-directory: ./src/Raven.Studio

  quill-web-storybook:
    name: Quill Dashboard (storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./src/Raven.Quill.Web
    steps:
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        filters: |
          quillWeb:
            - 'src/Raven.Quill.Web/**'

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.changes.outputs.quillWeb == 'true'

    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      if: steps.changes.outputs.quillWeb == 'true'
      with:
        package_json_file: src/Raven.Quill.Web/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.changes.outputs.quillWeb == 'true'
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: src/Raven.Quill.Web/pnpm-lock.yaml

    - name: Install dependencies
      if: steps.changes.outputs.quillWeb == 'true'
      run: pnpm install --frozen-lockfile

    # No playwright install: vitest targets system Chrome, which runners preinstall.
    - name: Run Storybook tests
      if: steps.changes.outputs.quillWeb == 'true'
      run: pnpm test:storybook
